<!doctype html>
<html lang=en>
<head>
<meta charset=UTF-8>
<title>Potato Quality</title>
<style>body{background:#2c251b;color:#f4ece1;text-align:center;padding:2rem}input{margin-bottom:1rem}</style>
</head>
<body>
<h1>Math Potato</h1>
<input type=file id=upload accept=image/*>
<br>
<canvas id=canvas width=400 height=300></canvas>
<br>
<button id=downloadBtn style="padding:10px 20px;background:#6b5c47;color:#fff;font-weight:700;border:none;border-radius:4px;cursor:pointer">
Download Spud
</button>
<script>const canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d"),upload=document.getElementById("upload"),img=new Image;upload.onchange=t=>{const a=t.target.files[0],e=new FileReader;e.onload=t=>{img.src=t.target.result,img.onload=()=>{canvas.width=img.width,canvas.height=img.height;const t=document.createElement("canvas");t.width=64,t.height=64;const a=t.getContext("2d");a.drawImage(img,0,0,64,64);const e=a.getImageData(0,0,64,64),n=e.data;for(let t=0;t<n.length;t+=4){let a=n[t],e=n[t+1],o=n[t+2],d=.321*a+.767*e+.189*o,c=.369*a+.676*e+.167*o,g=.272*a+.564*e+.131*o,m=50*(Math.random()-.5),l=64;n[t]=Math.round((d+m)/l)*l,n[t+1]=Math.round((c+m)/l)*l,n[t+2]=Math.round((g+m)/l)*l}a.putImageData(e,0,0),ctx.imageSmoothingEnabled=!1,ctx.drawImage(t,0,0,64,64,0,0,canvas.width,canvas.height)}},e.readAsDataURL(a)};const downloadBtn=document.getElementById("downloadBtn");downloadBtn.onclick=()=>{const t=document.createElement("a");t.download="Solanum.png",t.href=canvas.toDataURL("image/png"),t.click()}</script>
</body>
</html>
