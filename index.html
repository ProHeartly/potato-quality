<!DOCTYPE html>
<html lang=en>
<head>
    <meta charset="UTF-8">
    <title>Potato Quality</title>
    <style>
        body {
            background: #2c251b;
            color: #f4ece1;
            text-align: center;
            padding: 2rem;
        }
    </style>
</head>
<body>
    <h1>Math Potato</h1>
    <input type="file" id="u" accept="image/*">
    <canvas id="c"></canvas>
    <button id="d">
        Download Spud
    </button>
    <script>
        const x = c.getContext('2d');
        const im = new Image();
        u.onchange = e => {
            im.src = URL.createObjectURL(e.target.files[0]);
            im.onload = () => {
                let w = c.width = im.width;
                let h = c.height = im.height;
                let t = document.createElement('canvas');
                t.width = t.height = 64;
                let tx = t.getContext('2d');
                tx.drawImage(im, 0, 0, 64, 64);
                let id = tx.getImageData(0, 0, 64, 64);
                let p = id.data;
                for (let i=0; i<p.length; i+=4) {
                    let r = p[i], g = p[i+1], b = p[i+2];
                    let noise = (Math.random() - 0.5) * 50
                    let q = 64;
                    p[i] = Math.round((r*0.321 + g*0.767 + b*0.189 + noise) / q) * q;
                    p[i + 1] = Math.round((r*0.369 + g*0.676 + b*0.167 + noise) / q) * q;
                    p[i + 2] = Math.round((r*0.272 + g*0.564 + b*0.131 + noise) / q) * q;
                }
                tx.putImageData(id, 0, 0)
                x.imageSmoothingEnabled = false;
                x.drawImage(t, 0, 0, 64, 64, 0, 0, w, h);
            };
        };
        d.onclick = () => {
            let a = document.createElement('a');
            a.download = 'Solanum.png';
            a.href = c.toDataURL();
            a.click();
        };
    </script>
</body>
</html>
